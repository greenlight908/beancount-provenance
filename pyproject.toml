[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beancount-provenance"
version = "0.4.0"
description = "Pre-commit hook: fail if a Beancount ledger gains a transaction with no provenance, payee or narration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "greenlight" }]
keywords = ["beancount", "pre-commit", "provenance", "accounting", "audit-trail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = ["beancount>=3.1"]

[project.urls]
Homepage = "https://github.com/greenlight908/beancount-provenance"
Issues = "https://github.com/greenlight908/beancount-provenance/issues"

[project.scripts]
check-beancount-provenance = "beancount_provenance.cli:main"
backfill-beancount-provenance = "beancount_provenance.backfill:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_provenance"]

[tool.ruff]
# Line length is not enforced (see the estate ruff baseline).
line-length = 320

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF", "PERF101", "PERF401"]
ignore = [
    "E501",   # line length -- not enforced
    "S101",   # assert -- legitimate in tests and invariants
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
