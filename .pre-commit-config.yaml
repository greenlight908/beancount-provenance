# This repo's OWN dev hooks. The hook it PUBLISHES to consumers is in
# .pre-commit-hooks.yaml -- do not confuse the two.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff runs from the project's uv.lock, the version CI runs, so Renovate's lock bump
  # moves both. A pinned astral-sh/ruff-pre-commit `rev` was a second copy Renovate never
  # bumped (SDLC policy R4, 47-ruff-pin-drift). Flags mirror ruff-pre-commit's own hooks.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    hooks:
      # Through the project venv so it resolves the same pyright as CI.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
